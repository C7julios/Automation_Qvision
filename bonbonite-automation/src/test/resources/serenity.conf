serenity {
  project.name = "Bon-bonite - Pruebas automatizadas sitio web v1"
  take.screenshots = FOR_EACH_ACTION
  logging = VERBOSE
}

webdriver {
  driver = chrome
  autodownload = true
  timeouts {
    implicitlywait = 5000
    fluentwait = 20000
  }
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    pageLoadStrategy = "normal"
    "goog:chromeOptions" {
      args = ["start-maximized", "remote-allow-origins=*", "disable-notifications",
              "disable-popup-blocking", "lang=es-CO", "window-size=1920,1080"]
    }
  }
}

headless.mode = false

environments {
  default {
    webdriver.base.url = "https://www.bon-bonite.com"
  }
}
